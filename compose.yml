version: "3.8"

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        TERRAFORM_VERSION: 1.7.0
    container_name: fastapi-dev
    volumes:
      - .:/workspace
      - /workspace/.venv
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8000
    stdin_open: true
    tty: true

  prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        TERRAFORM_VERSION: 1.7.0
    container_name: fastapi-prod
    ports:
      - "8001:8000"
    environment:
      PYTHONUNBUFFERED: "1"
