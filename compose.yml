version: "3.8"

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        TERRAFORM_VERSION: 1.7.0
    container_name: fastapi-dev
    volumes:
      - .:/workspace
      - /workspace/.venv
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    stdin_open: true
    tty: true

