[project]
name = "fastapi-app"
version = "0.1.0"
description = "FastAPI development environment"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "gunicorn>=23.0.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.18.0",
    "alembic>=1.8.0",
    "structlog>=24.0.0",
    "python-json-logger>=2.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.3.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "mypy>=1.8.0",
    "taskipy>=1.12.0",
    "pre-commit>=3.4.0",
    "debugpy>=1.8.20",
]

[tool.taskipy.tasks]
fmt = "ruff format ."
fmt-check = "ruff format . --check"
lint = "ruff check ./app --fix"
lint-check = "ruff check ./app"
type = "mypy ./app"
test = "pytest tests"
test-unit = "pytest tests/unit"
test-integration = "pytest tests/integration"
check = "task fmt-check && task lint-check && task type && task test"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by formatter
    "B008", # do not perform function call in argument defaults (FastAPI standard)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-v --cov --cov-report=term-missing"

[tool.coverage.run]
relative_files = true
