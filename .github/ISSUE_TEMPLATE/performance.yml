name: パフォーマンス改善
description: パフォーマンス改善の提案
title: "[PERF] "
labels: ["performance"]
body:
  - type: markdown
    attributes:
      value: |
        パフォーマンス改善のご提案ありがとうございます。以下のフォームに必要な情報をご記入ください。

  - type: textarea
    id: performance-issue
    attributes:
      label: パフォーマンスの問題
      description: どのようなパフォーマンスの問題があるのかを記載してください。
      placeholder: 遅延、メモリ使用量、CPU使用率など
    validations:
      required: true

  - type: input
    id: target-location
    attributes:
      label: 対象箇所
      description: パフォーマンス問題が発生している箇所を記載してください。
      placeholder: "例: api/users エンドポイント, データベースクエリ"
    validations:
      required: false

  - type: textarea
    id: current-performance
    attributes:
      label: 現在のパフォーマンス
      description: 現在のパフォーマンス指標を記載してください。
      placeholder: |
        - 応答時間: 500ms
        - メモリ使用量: 1GB
        - 処理時間: 10秒
    validations:
      required: false

  - type: textarea
    id: target-performance
    attributes:
      label: 目標パフォーマンス
      description: 達成したいパフォーマンス目標を記載してください。
      placeholder: |
        - 応答時間: 100ms以下
        - メモリ使用量: 500MB以下
        - 処理時間: 3秒以下
    validations:
      required: false

  - type: dropdown
    id: performance-type
    attributes:
      label: 改善の種類
      description: パフォーマンス改善の種類を選択してください。
      options:
        - 応答速度の改善
        - メモリ使用量の削減
        - CPU使用率の削減
        - データベースクエリの最適化
        - キャッシュの活用
        - その他
    validations:
      required: false

  - type: textarea
    id: proposed-solution
    attributes:
      label: 提案する改善策
      description: どのように改善すべきか、具体的な提案を記載してください。
      placeholder: |
        インデックスの追加、キャッシュの導入、アルゴリズムの改善など
    validations:
      required: false

  - type: textarea
    id: measurement-method
    attributes:
      label: 測定方法
      description: パフォーマンス改善をどのように測定・検証するかを記載してください。
      placeholder: ベンチマークツール、プロファイリング方法など
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: 追加情報
      description: その他、参考になる情報があれば記載してください。
      placeholder: プロファイリング結果、ベンチマーク結果など
    validations:
      required: false
