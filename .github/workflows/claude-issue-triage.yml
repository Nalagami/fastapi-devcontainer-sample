name: Claude Issue Triage

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  triage:
    if: |
      github.event_name == 'issues' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: true
          claude_args: "--model global.anthropic.claude-sonnet-4-6 --max-turns 10"
          github_token: ${{ steps.app-token.outputs.token }}
          prompt: |
            FastAPI + Python 3.13 + SQLAlchemy 非同期プロジェクトの Issue を分析してください。
            アーキテクチャ: routers → crud → models/schemas のレイヤー構成。
            主要ファイル: app/main.py, app/routers/, app/crud/, app/models/, app/schemas/

            以下を日本語でコメントしてください：
            1. 影響するアーキテクチャ層
            2. 複雑さの見積もり（simple/medium/complex）
            3. 非同期・型安全・セキュリティへの影響
            4. 参照すべき instructions ファイル
